# curl, wget, httpie and friends get a plain-text page instead of HTML
map $http_user_agent $is_cli {
    default 0;
    ~*^(curl|wget|httpie|xh)/ 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # hashed build assets never change
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = / {
        add_header Vary "User-Agent";
        add_header Cache-Control "public, max-age=300";
        if ($is_cli) {
            rewrite ^ /curl.txt last;
        }
        try_files /index.html =404;
    }

    location = /curl.txt {
        add_header Vary "User-Agent";
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    error_page 404 /404.html;
}
